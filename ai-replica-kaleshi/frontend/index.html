<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Replica – Kaleshi Edition</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    label { display:block; margin-top:12px; font-weight:600; }
    input, textarea, select, button { width:100%; padding:8px; margin-top:6px; box-sizing: border-box; }
    button { cursor: pointer; }
    #response { white-space: pre-wrap; background:#f5f5f5; padding:12px; border-radius:6px; min-height: 24px; }
    #conv { max-height: 250px; overflow-y: auto; border:1px solid #ddd; padding:8px; border-radius:6px; margin-top:12px; }
    .msg { margin:4px 0; }
    .user { color:#0066cc; }
    .assistant { color:#008844; }
    small { color:#555; }
  </style>
</head>
<body>
  <h1>AI Replica – Kaleshi Edition</h1>

  <label>User ID</label>
  <input id="userId" placeholder="e.g. user123" />

  <label>Name</label>
  <input id="name" placeholder="Your name" />

  <label>Personality traits (comma separated)</label>
  <input id="traits" placeholder="e.g. funny, caring, slightly sarcastic" />

  <label>Style notes</label>
  <input id="style" placeholder="e.g. Hinglish, casual, emoji use karta hai" />

  <label>Kaleshi level (0–1)</label>
  <input id="kaleshi" type="number" step="0.1" min="0" max="1" value="0.5" />
  <small>0 = calm, 1 = full nakhre wala</small>

  <label>Relationship label</label>
  <select id="relation">
    <option value="gf">gf</option>
    <option value="bestie">bestie</option>
    <option value="friend">friend</option>
  </select>

  <button onclick="createUser()">Create / Update User</button>

  <hr />

  <label>Your message</label>
  <textarea id="prompt" rows="4" placeholder="Type something in Hinglish..."></textarea>

  <button onclick="sendMessage()">Send to Replica</button>

  <h2>Replica Reply</h2>
  <div id="response"></div>

  <h2>Conversation</h2>
  <div id="conv"></div>

  <script>
    // Frontend is served by the same FastAPI server, so relative URLs work everywhere.
    const API = "";

    async function createUser() {
      const userId = document.getElementById("userId").value.trim();
      const name = document.getElementById("name").value.trim();
      const traits = document.getElementById("traits").value
        .split(",")
        .map(t => t.trim())
        .filter(Boolean);
      const style = document.getElementById("style").value.trim();
      const kaleshi = parseFloat(document.getElementById("kaleshi").value || "0.5");
      const relation = document.getElementById("relation").value;

      if (!userId || !name) {
        alert("User ID and Name are required");
        return;
      }

      const body = {
        user_id: userId,
        name,
        bio: "AI replica user",
        personality_traits: traits,
        style_notes: style || null,
        kaleshi_level: kaleshi,
        favorite_topics: [],
        relationship_label: relation,
      };

      // Try create; if user already exists, fall back to update (PUT)
      let res = await fetch(`${API}/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (res.status === 400) {
        res = await fetch(`${API}/users/${userId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      }

      if (!res.ok) {
        const err = await res.json();
        alert("Error: " + (err.detail || "Unknown"));
        return;
      }

      alert("User created/updated successfully");
      loadConversation(userId);
    }

    async function sendMessage() {
      const userId = document.getElementById("userId").value.trim();
      const prompt = document.getElementById("prompt").value.trim();
      if (!userId || !prompt) {
        alert("User ID and message are required");
        return;
      }

      const body = {
        user_id: userId,
        prompt,
        conversation: [],
        temperature: 0.7,
        max_tokens: 512,
      };

      const res = await fetch(`${API}/replica/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json();
        alert("Error: " + (err.detail || "Unknown"));
        return;
      }

      const data = await res.json();
      document.getElementById("response").textContent = data.reply;
      loadConversation(userId);
      document.getElementById("prompt").value = "";
    }

    async function loadConversation(userId) {
      const res = await fetch(`${API}/replica/conversation/${userId}`);
      if (!res.ok) return;
      const data = await res.json();
      const convDiv = document.getElementById("conv");
      convDiv.innerHTML = "";
      for (const m of data.conversation || []) {
        const div = document.createElement("div");
        div.className = "msg " + (m.role === "user" ? "user" : "assistant");
        div.textContent = (m.role === "user" ? "You: " : "Replica: ") + m.content;
        convDiv.appendChild(div);
      }
      convDiv.scrollTop = convDiv.scrollHeight;
    }
  </script>
</body>
</html>
